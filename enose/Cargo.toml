[package]
name = "Enose"
version = "0.2.0"
edition = "2021"

[dependencies]
# ESP-IDF Services (re-exports esp-idf-hal & esp-idf-sys)
esp-idf-svc = { version = "0.51", features = ["critical-section"] }
esp-idf-hal = "0.45"
embedded-svc = "0.28"

# Logging
log = "0.4"

# DHT sensor (uses embedded-hal 0.2 traits)
dht-sensor = "0.2.1"
embedded-hal = { version = "0.2.7", features = ["unproven"] }

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SHA-256 untuk verifikasi firmware OTA
sha2 = { version = "0.10", default-features = false }

# Error handling
anyhow = "1"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"
lto = true

[profile.dev]
opt-level = 1
debug = true